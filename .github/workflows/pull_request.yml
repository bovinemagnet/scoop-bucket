name: Pull Requests

# Checks a pull request's manifests when it is opened. There is no /verify comment trigger: it
# would run the pull request's head as it stands then, which can change after the comment.
# Re-run this workflow from the Actions tab instead.
on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pullRequestHandler:
    name: Pull Request Handler
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Pull Request Handler
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
