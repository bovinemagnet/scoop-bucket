name: Issues

on:
  issues:
    types: [opened, labeled]

permissions:
  # Auto hash fixing commits
  contents: write
  issues: write

jobs:
  issueHandler:
    name: Issue Handler
    # The handler can commit a new hash to main, so it runs for issues opened by the owner and
    # collaborators, or when one of them adds the verify label itself (which needs triage access).
    if: (github.event.action == 'opened' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) || (github.event.action == 'labeled' && github.event.label.name == 'verify')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Issue Handler
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
